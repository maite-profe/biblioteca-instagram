<!DOCTYPE html><html lang="es"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,Arial;background:#f5f8f6;color:#203c3b;margin:0;padding:22px}main{max-width:460px;margin:auto;background:white;padding:24px;border-radius:20px;box-shadow:0 5px 28px #183a2a12}h1{font-size:24px}label{display:block;font-weight:650;margin:16px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #b8ccc3;border-radius:12px;padding:14px;font:inherit}button{width:100%;padding:15px;background:#247e63;color:white;border:0;border-radius:12px;font-weight:750;font-size:16px;margin-top:20px}button:disabled{opacity:.6}.hidden{display:none}small{color:#60736c}#msg{margin-top:15px}a{color:#17644e}</style></head><body><main><h1>➕ Añadir idea</h1><p>Biblioteca de Redes · Punta Galea</p><form id="f"><label>Enlace</label><input id="url" type="url" placeholder="Pega aquí el enlace" required><label>Tu nombre</label><input id="nombre" required autocomplete="name" placeholder="Nombre y apellido"><label for="tema">Tema</label><select id="tema" required><option value="">Cargando temas…</option></select><div id="newTopicWrap" class="hidden"><label for="temaNuevo">Nombre del nuevo tema</label><input id="temaNuevo" maxlength="70" placeholder="Ej. Plan de formación"></div><label>Comentario (opcional)</label><textarea id="descripcion" rows="3" placeholder="Ej. Para la graduación"></textarea><label>Título (opcional)</label><input id="titulo" placeholder="La web puede proponer uno"><button id="save" type="submit">Guardar en la biblioteca</button></form><div id="msg" role="status"></div><p><small>Utiliza tu cuenta de Google del colegio. Las ideas se incorporan directamente a la biblioteca.</small></p><a href="https://maite-profe.github.io/biblioteca-instagram/" target="_blank">Ver biblioteca</a></main><script>const select=document.getElementById('tema'),newTopicWrap=document.getElementById('newTopicWrap'),newTopic=document.getElementById('temaNuevo');function loadTopics(){google.script.run.withSuccessHandler(topics=>{select.innerHTML='<option value="">Selecciona un tema</option>';topics.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;select.appendChild(o)});const o=document.createElement('option');o.value='__nuevo__';o.textContent='＋ Crear nuevo tema';select.appendChild(o)}).withFailureHandler(e=>{select.innerHTML='<option value="">No se pudieron cargar los temas</option>';document.getElementById('msg').textContent=e.message}).getTemas()}select.addEventListener('change',()=>{const fresh=select.value==='__nuevo__';newTopicWrap.classList.toggle('hidden',!fresh);newTopic.required=fresh;if(!fresh)newTopic.value='' });loadTopics();const p=new URLSearchParams(location.search);if(p.get('url'))document.getElementById('url').value=p.get('url');document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;m.textContent='Guardando…';google.script.run.withSuccessHandler(r=>{m.innerHTML='✓ Idea guardada. <a target="_blank" href="'+r.url+'">Ver biblioteca</a>';document.getElementById('f').reset();newTopicWrap.classList.add('hidden');newTopic.required=false;loadTopics();b.disabled=false}).withFailureHandler(err=>{m.textContent='No se ha guardado: '+err.message;b.disabled=false}).saveIdea({tema:select.value,temaNuevo:newTopic.value,nombre:document.getElementById('nombre').value,url:document.getElementById('url').value,descripcion:document.getElementById('descripcion').value,titulo:document.getElementById('titulo').value})});</script></body></html>
